# herdr-multiagent-dev のユーザー全体設定（全マシン共通の既定・正本）
# 優先順: プロジェクト直下の agents.yaml > 同ディレクトリの agents.local.yaml（マシン固有・git管理外）> このファイル。
# 最初に見つかったファイルを丸ごと使う（マージしない）。マシン依存の変更は agents.local.yaml に書き、このファイルに差分を出さない。
# 新しいマシン・CLI更新時は書き写さず実測して更新すること。
agents:
  cursor:
    cmd: cursor-agent
    model_flag: "--model"          # 候補は cursor-agent --list-models
    # effort の独立フラグ無し → モデル名で表現（cursor-grok-4.5-high 等）。effort_args を定義しない
    default_model: composer-2.5
    extra_args: ["--force"]        # 無人化（明示拒否以外のコマンド実行を許可）
    credit_error_patterns:
      - "usage limit"
    interaction:
      gate_detection: screen       # herdr は cursor の Trust ダイアログを検知しない → 画面を読む
      startup_gate_pattern: "Trust this workspace"
      startup_keys: ["a"]          # --force では抑止されない Trust ダイアログ
  codex:
    cmd: codex
    model_flag: "-m"
    effort_args: ["-c", "model_reasoning_effort={effort}"]  # high のみ実測（codex-cli 0.147.0）。他値は要実測
    default_model: gpt-5.6-terra
    extra_args: ["-a", "never", "-s", "workspace-write"]  # 承認UIを出さない+WS内書込
    # サンドボックスは外部プロセス起動やネットワークを遮断する。それに依存するテストは
    # codex 環境でだけ落ちるため、レビュー契約で除外し、指揮者が自分の環境で実測して確定する。
    credit_error_patterns:
      - "usage limit"
      - "rate limit"
      - "at capacity"             # 可用性エラー。判定未出力で中断するためフォールバック扱いが正しい（2026-08-17 実測）
    interaction:
      gate_detection: herdr        # agent start が agent_not_ready を返す
      startup_gate_pattern: "Do you trust the contents of this directory"
      startup_keys: ["enter"]      # 既定選択は "1. Yes, continue"
  claude-code:
    cmd: claude
    model_flag: "--model"
    effort_args: ["--effort", "{effort}"]  # 有効値: low/medium/high/xhigh/max（claude 2.1.226 --help）
    default_model: claude-opus-5
    extra_args: ["--permission-mode", "auto"]
    credit_error_patterns:
      - "credit balance"
      - "usage limit"
    interaction:
      gate_detection: herdr        # agent start が agent_not_ready を返す
      # 既定選択は "No, exit"。enter だけを送るとエージェントが終了する（2026-08-29 実測）
      startup_gate_pattern: "Is this a project you created or one you trust"
      startup_keys: ["down", "enter"]
  opencode:
    cmd: opencode
    # 非対話モード。TUI を起動せず1回の実行で完結するため、ペイン操縦
    # （ペイン作成・起動ゲート・状態ポーリング）が一切不要。
    # 出力は stdout にそのまま出るので折返しの復元も要らない。
    mode: headless
    run_args: ["run", "--dir", "{dir}"]   # {dir} は作業ディレクトリ（サンドボックス境界にもなる）
    model_flag: "-m"
    # プロバイダ集約型。deepseek / gemini / gpt / glm / grok / kimi 等を1 CLI から選べる
    # （`opencode models` で一覧）。codex とは別の課金経路なので、単一候補依存を避けられる。
    default_model: opencode/deepseek-v4-flash
    extra_args: []
    # --dir の外への書込を既定で自動拒否する。拒否されると適応せず停止する。
    # 契約で回避するのではなく ~/.config/opencode/opencode.json の
    # permission.external_directory で許可する（SKILL.md の「よくある失敗」参照）。
    sandbox: dir_only
    credit_error_patterns:      # 未実測。codex/claude の文言に合わせた暫定値
      - "usage limit"
      - "rate limit"

roles:
  # 先頭が主担当、以降フォールバック順。model 省略時は default_model。
  # effort は任意。effort_args を持つエージェントのみ有効（cursor はモデル名で表現する）。
  # extra_args は任意。指定時はエージェント定義の extra_args を丸ごと置換する。
  # クロスレビュー原則: builder と reviewer は別ベンダーに保つこと。
  commander:
    # 指揮の委譲先。herdr CLI を Bash で叩くため無人フル権限が必須。
    # codex はサンドボックスが外部プロセス起動を遮断するため司令役に使えない。
    - { agent: claude-code, model: claude-opus-5, effort: xhigh }
    - { agent: cursor, model: cursor-grok-4.6-high }
  planner:
    - { agent: claude-code, model: claude-opus-5, effort: xhigh }
    - { agent: cursor, model: cursor-grok-4.6-xhigh }
    - { agent: codex, model: gpt-5.6-terra, effort: high }
  plan-reviewer:
    # 非対話が既定（操縦コストゼロ・出力が確実に読める）。ベンダーも codex/claude と別系統
    - { agent: opencode, model: opencode/deepseek-v4-flash }
    - { agent: codex, model: gpt-5.6-sol, effort: high }
    - { agent: cursor, model: cursor-grok-4.6-high }
    - { agent: claude-code, model: claude-opus-5, effort: xhigh }
  builder:
    - { agent: cursor, model: cursor-grok-4.6-high-fast }
    - { agent: codex, model: gpt-5.6-luna, effort: max }
    - { agent: claude-code, model: claude-sonnet-5, effort: max }
  reviewer:
    - { agent: opencode, model: opencode/deepseek-v4-flash }
    - { agent: codex, model: gpt-5.6-sol, effort: high }
    - { agent: cursor, model: cursor-grok-4.6-high }
    - { agent: claude-code, model: claude-opus-5, effort: xhigh }
  fixer:
    - { agent: cursor, model: cursor-grok-4.6-high-fast }
    - { agent: codex, model: gpt-5.6-luna, effort: max }
    - { agent: claude-code, model: claude-sonnet-5, effort: max }
